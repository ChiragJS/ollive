services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ollive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollive}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollive} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  observability-service:
    build:
      context: .
      dockerfile: services/observability-service/Dockerfile
    environment:
      OBSERVABILITY_DATABASE_URL: ${OBSERVABILITY_DATABASE_URL:-postgresql://ollive:ollive@postgres:5432/observability_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      INFERENCE_EVENTS_STREAM: ${INFERENCE_EVENTS_STREAM:-INFERENCE_EVENTS}
      INFERENCE_EVENTS_SUBJECT: ${INFERENCE_EVENTS_SUBJECT:-inference.events}
      OBSERVABILITY_SERVICE_NAME: ${OBSERVABILITY_SERVICE_NAME:-observability-service}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    environment:
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:-postgresql://ollive:ollive@postgres:5432/chat_app_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      INFERENCE_EVENTS_STREAM: ${INFERENCE_EVENTS_STREAM:-INFERENCE_EVENTS}
      INFERENCE_EVENTS_SUBJECT: ${INFERENCE_EVENTS_SUBJECT:-inference.events}
      APPLICATION_NAME: ${APPLICATION_NAME:-ollive-demo-chat}
      CHAT_SERVICE_NAME: ${CHAT_SERVICE_NAME:-chat-service}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-mock-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:5173}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Ollive Assignment}
      OBSERVABILITY_HTTP_URL: ${OBSERVABILITY_HTTP_URL:-http://observability-service:8001/v1/ingest/events}
      PII_REDACTION_MODE: ${PII_REDACTION_MODE:-standard}
      PII_PREVIEW_MAX_CHARS: ${PII_PREVIEW_MAX_CHARS:-500}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  chat-ui:
    build:
      context: .
      dockerfile: services/chat-ui/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - chat-service

  dashboard-ui:
    build:
      context: .
      dockerfile: services/dashboard-ui/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - observability-service

volumes:
  postgres_data:
  nats_data:
