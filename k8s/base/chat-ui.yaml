apiVersion: v1
kind: Service
metadata:
  name: chat-ui
  labels:
    app.kubernetes.io/name: chat-ui
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: chat-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  labels:
    app.kubernetes.io/name: chat-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-ui
    spec:
      containers:
        - name: chat-ui
          image: ollive-assignment-chat-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
