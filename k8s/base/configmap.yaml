apiVersion: v1
kind: ConfigMap
metadata:
  name: ollive-config
data:
  POSTGRES_USER: ollive
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  NATS_URL: nats://nats:4222
  TELEMETRY_TRANSPORT: nats
  INFERENCE_EVENTS_STREAM: INFERENCE_EVENTS
  INFERENCE_EVENTS_SUBJECT: inference.events
  APPLICATION_NAME: ollive-demo-chat
  CHAT_SERVICE_NAME: chat-service
  OBSERVABILITY_SERVICE_NAME: observability-service
  ENVIRONMENT: k8s
  DEFAULT_PROVIDER: mock
  DEFAULT_MODEL: mock-chat
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_MODEL: gpt-4.1-mini
  DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
  DEEPSEEK_MODEL: deepseek-chat
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  GROQ_MODEL: llama-3.1-8b-instant
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: openai/gpt-oss-120b:free
  OPENROUTER_HTTP_REFERER: http://localhost:5173
  OPENROUTER_APP_TITLE: Ollive Assignment
  OBSERVABILITY_HTTP_URL: http://observability-service:8001/v1/ingest/events
  PII_REDACTION_MODE: standard
  PII_PREVIEW_MAX_CHARS: "500"
  CONTEXT_MESSAGE_LIMIT: "8"
