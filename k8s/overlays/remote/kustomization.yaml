apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ollive-assignment-chat-service
    newName: ghcr.io/example/ollive-assignment-chat-service
    newTag: v0.1.0
  - name: ollive-assignment-observability-service
    newName: ghcr.io/example/ollive-assignment-observability-service
    newTag: v0.1.0
  - name: ollive-assignment-chat-ui
    newName: ghcr.io/example/ollive-assignment-chat-ui
    newTag: v0.1.0
  - name: ollive-assignment-dashboard-ui
    newName: ghcr.io/example/ollive-assignment-dashboard-ui
    newTag: v0.1.0

patches:
  - target:
      kind: Ingress
      name: ollive-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: chat.example.com
      - op: replace
        path: /spec/rules/1/host
        value: dashboard.example.com
  - target:
      kind: Deployment
      name: chat-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: observability-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: chat-ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: dashboard-ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
